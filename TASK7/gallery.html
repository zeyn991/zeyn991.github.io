<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея изображений — КубГУ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="gallery.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js" defer></script>
    <script src="gallery.js" defer></script>
</head>
<body class="bg-light">

    <header class="bg-dark text-white">
        <div class="container d-flex align-items-center gap-3 py-3">
            <img src="logo.png" alt="Логотип сайта" class="logo bg-white px-2 py-1">
            <p class="fw-bold fs-5 m-0">Добро пожаловать на официальный сайт Zeyn</p>
        </div>
    </header>

    <nav class="bg-secondary">
        <div class="container py-2">
            <ul class="nav flex-column flex-md-row gap-md-3">
                <li class="nav-item">
                    <a class="nav-link text-white px-0 px-md-2 fw-bold" href="gallery.html">Галерея</a>
                </li>
            </ul>
        </div>
    </nav>

    <main class="container d-flex flex-column py-4">

        <section id="gallery" class="bg-white border p-3 p-md-4 mb-4">
            <h1 class="h2">Галерея изображений</h1>
            <p class="text-muted">Листайте галерею стрелками, под ней отображается номер текущей страницы.</p>

            <div id="gallery-slider" class="gallery mt-3">
                <div class="gallery-slide"><img src="gallery/1.jpg" alt="Изображение 1"></div>
                <div class="gallery-slide"><img src="gallery/2.jpg" alt="Изображение 2"></div>
                <div class="gallery-slide"><img src="gallery/3.jpg" alt="Изображение 3"></div>
                <div class="gallery-slide"><img src="gallery/4.jpg" alt="Изображение 4"></div>
                <div class="gallery-slide"><img src="gallery/5.jpg" alt="Изображение 5"></div>
                <div class="gallery-slide"><img src="gallery/6.jpg" alt="Изображение 6"></div>
                <div class="gallery-slide"><img src="gallery/7.jpg" alt="Изображение 7"></div>
                <div class="gallery-slide"><img src="gallery/8.jpg" alt="Изображение 8"></div>
            </div>

            <div id="gallery-dots" class="gallery-dots mt-3"></div>
            <p id="gallery-pager" class="text-center text-muted mt-2 mb-0" aria-live="polite"></p>
        </section>

    </main>

    <footer class="bg-dark text-white text-center py-3">
        <div class="container">
            <p class="mb-0">&copy; 2026 Ящук Павел</p>
        </div>
    </footer>

</body>
</html>
