<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор стоимости заказа — КубГУ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="calculator.js" defer></script>
</head>
<body class="bg-light">

    <header class="bg-dark text-white">
        <div class="container d-flex align-items-center gap-3 py-3">
            <img src="logo.png" alt="Логотип сайта" class="logo bg-white px-2 py-1">
            <p class="fw-bold fs-5 m-0">Добро пожаловать на официальный сайт Zeyn</p>
        </div>
    </header>

    <nav class="bg-secondary">
        <div class="container py-2">
            <ul class="nav flex-column flex-md-row gap-md-3">
                <li class="nav-item order-2 order-md-1">
                    <a class="nav-link text-white px-0 px-md-2" href="index.html#links">Список ссылок</a>
                </li>
                <li class="nav-item order-1 order-md-2">
                    <a class="nav-link text-white px-0 px-md-2" href="index.html#schedule">Таблица</a>
                </li>
                <li class="nav-item order-3">
                    <a class="nav-link text-white px-0 px-md-2" href="index.html#form">Форма</a>
                </li>
                <li class="nav-item order-4">
                    <a class="nav-link text-white px-0 px-md-2 fw-bold" href="calculator.html">Калькулятор</a>
                </li>
            </ul>
        </div>
    </nav>

    <main class="container d-flex flex-column py-4">

        <section id="calculator" class="bg-white border p-3 p-md-4 mb-4">
            <h1 class="h2">Калькулятор стоимости заказа</h1>
            <p class="text-muted">Выберите тип товара, укажите количество — стоимость пересчитывается автоматически.</p>

            <form id="calc-form" class="mt-3" novalidate style="max-width: 420px;">
                <div class="row g-3">

                    <div class="col-12">
                        <label for="calc-quantity" class="form-label">Количество:</label>
                        <input type="text" id="calc-quantity" class="form-control" placeholder="Например, 3" autocomplete="off">
                    </div>

                    <div class="col-12">
                        <span class="form-label d-block">Тип товара:</span>
                        <div class="form-check">
                            <input id="calc-type-1" class="form-check-input" type="radio" name="calc-type" value="1" checked>
                            <label for="calc-type-1" class="form-check-label">Наушники — 2500 ₽</label>
                        </div>
                        <div class="form-check">
                            <input id="calc-type-2" class="form-check-input" type="radio" name="calc-type" value="2">
                            <label for="calc-type-2" class="form-check-label">Клавиатура — 4300 ₽</label>
                        </div>
                        <div class="form-check">
                            <input id="calc-type-3" class="form-check-input" type="radio" name="calc-type" value="3">
                            <label for="calc-type-3" class="form-check-label">Монитор — 15800 ₽</label>
                        </div>
                    </div>

                    <div class="col-12" id="calc-options-group" hidden>
                        <label for="calc-option" class="form-label">Опция:</label>
                        <select id="calc-option" class="form-select">
                            <option value="0">Стандартная — +0 ₽</option>
                            <option value="800">С подсветкой RGB — +800 ₽</option>
                            <option value="1500">Механическая — +1500 ₽</option>
                        </select>
                    </div>

                    <div class="col-12" id="calc-property-group" hidden>
                        <div class="form-check">
                            <input id="calc-property" class="form-check-input" type="checkbox">
                            <label for="calc-property" class="form-check-label">Расширенная гарантия — +3000 ₽</label>
                        </div>
                    </div>

                    <div class="col-12">
                        <p id="calc-error" class="alert alert-danger mb-0" hidden></p>
                        <p id="calc-result" class="alert alert-success mb-0" hidden></p>
                    </div>

                </div>
            </form>
        </section>

    </main>

    <footer class="bg-dark text-white text-center py-3">
        <div class="container">
            <p class="mb-0">&copy; 2026 Ящук Павел</p>
        </div>
    </footer>

</body>
</html>
